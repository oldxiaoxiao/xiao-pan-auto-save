name: Build and release
on:
  workflow_dispatch:
  push:
    branches: ['codex/release-*']
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install '.[desktop]'
      - run: python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.runner }}
          path: release/*
          if-no-files-found: error
  container:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        shell: bash
        run: |
          VERSION=$(python -c 'from backend import __version__; print(__version__)')
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/}" != "v$VERSION" ]]; then
            echo 'Tag and backend version do not match'; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/oldxiaoxiao/xiao-pan-auto-save:${{ steps.version.outputs.version }}
            ghcr.io/oldxiaoxiao/xiao-pan-auto-save:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - run: python -m pip install pyyaml
      - id: version
        shell: bash
        run: echo "version=$(python -c 'from backend import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"
      - name: Package Compose configuration and checksums
        shell: bash
        run: |
          python scripts/build_compose_release.py
          cd release
          sha256sum *.zip > SHA256SUMS
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS --title "$GITHUB_REF_NAME · 小盘自动转存" --notes-file "docs/release-notes-${{ steps.version.outputs.version }}.md"
